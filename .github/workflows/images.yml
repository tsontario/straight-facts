# Builds, tests, publishes and attests the factory-built images (decision 0002 §6): the
# sandbox image and the gateway image. Protected core (L-0001).
#
# Runs only on main and only on GitHub-hosted runners; never on pull_request_target.
# Only images whose current inputs are not yet published are built. Each architecture is
# built on a native runner, tested and scanned before it is pushed. Each image's
# multi-arch index is attested, and a pin pull request then records its digest and this
# run's commit in images/images.toml.
name: images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - src/images/images.ts
      - src/gateway/**
      - src/util/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      images: ${{ steps.status.outputs.images }}
      builds: ${{ steps.status.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merging a pin changes images.toml; the same inputs must not be published twice.
      # "Published" means the index exists and carries this workflow's attestation from main.
      - name: Which images are not yet published?
        id: status
        run: bun src/images/images.ts unpublished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.images != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.check.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build and test the image
        run: bun test "$TESTS"
        env:
          TESTS: ${{ matrix.tests }}

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan and push the tested image
        run: bun src/images/images.ts push "$IMAGE" "$ARCH"
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}

  publish:
    needs: [check, build]
    strategy:
      matrix:
        image: ${{ fromJSON(needs.check.outputs.images) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch index
        id: index
        run: bun src/images/images.ts publish-index "$IMAGE"
        env:
          IMAGE: ${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Show the pin
        run: |
          {
            echo "### $IMAGE image published"
            echo
            echo "Pin it in images/images.toml:"
            echo
            echo '```toml'
            echo "[$IMAGE.pin]"
            echo "digest = \"$DIGEST\""
            echo "commit = \"$GITHUB_SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
