# Scans the full history for secrets and personal data on every push and pull request (L-0038).
# Protected core (L-0001): this file, .betterleaks.toml, and scripts/install-betterleaks.sh.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Betterleaks
        run: scripts/install-betterleaks.sh "$RUNNER_TEMP/bin"

      - name: Scan full history
        run: |
          # Inline allow comments and ignore files are not honored; only .betterleaks.toml can suppress.
          empty=$(mktemp -d)
          "$RUNNER_TEMP/bin/betterleaks" git . \
            --config .betterleaks.toml \
            --redact --no-banner \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$empty"
